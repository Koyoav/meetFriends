name: Backend CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: meetfriends
          MYSQL_USER: meetfriends
          MYSQL_PASSWORD: meetfriends
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations against MySQL
        env:
          DATABASE_URL: mysql+pymysql://meetfriends:meetfriends@127.0.0.1:3306/meetfriends
          # alembic's console-script entry point doesn't add the cwd to
          # sys.path (unlike pytest), so "from app import models" in
          # alembic/env.py would otherwise fail with ModuleNotFoundError.
          PYTHONPATH: .
        run: alembic upgrade head

      - name: Run tests with 100% coverage gate
        run: pytest -v
